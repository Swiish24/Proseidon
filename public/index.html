<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proseidon</title>
<meta name="description" content="Climb ten levels of English, from parts of speech to PhD. Compete on the leaderboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: header with stats, horizontal level map, one focused question card */
  --paper:#EEF3F2; --card:#FFFFFF; --ink:#13263A; --muted:#566977; --line:#D3DEDD;
  --sea:#1C6B74; --sea-soft:#DCEEEF; --brass:#9C6F1E; --brass-soft:#F6EBD3;
  --ok:#2E7A4D; --ok-soft:#E1F2E7; --bad:#B03F35; --bad-soft:#F9E3E0;
  --display:"Cinzel", Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1823; --card:#132331; --ink:#E4EDF1; --muted:#93A6B3; --line:#24394A;
  --sea:#5BB9C2; --sea-soft:#163A44; --brass:#DDB05A; --brass-soft:#3A2E16;
  --ok:#6CCB91; --ok-soft:#173627; --bad:#EE8379; --bad-soft:#3D1D1A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0C1823; --card:#132331; --ink:#E4EDF1; --muted:#93A6B3; --line:#24394A;
  --sea:#5BB9C2; --sea-soft:#163A44; --brass:#DDB05A; --brass-soft:#3A2E16;
  --ok:#6CCB91; --ok-soft:#173627; --bad:#EE8379; --bad-soft:#3D1D1A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.06em;margin:0;line-height:1;color:var(--sea)}
.tag{margin:6px 0 0;color:var(--muted);font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:70px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat.hot b{color:var(--brass)}
.map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.lv{font:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.lv .n{font-family:var(--display);font-size:18px;color:var(--ink)}
.lv .s{font-size:11px;line-height:1.2}
.lv.done{border-color:var(--ok);background:var(--ok-soft)}
.lv.done .s{color:var(--ok)}
.lv.cur{border:2px solid var(--sea);background:var(--sea-soft)}
.lv:focus-visible,button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--sea-soft);color:var(--sea)}
.pill.scenic{background:var(--brass-soft);color:var(--brass)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad);border-color:var(--bad)}
.dot.now{border-color:var(--sea);border-width:3px}
.prompt{font-size:21px;line-height:1.45;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{font:inherit;font-size:16px;text-align:left;cursor:pointer;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--sea)}
.opt .k{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);flex-shrink:0;margin-top:3px}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:16px;cursor:pointer;border-radius:10px;padding:10px 18px;border:1.5px solid var(--sea);background:var(--sea);color:var(--card)}
.btn.ghost{background:transparent;color:var(--sea)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--card)}
.err{color:var(--bad);font-size:14px;margin:0;min-height:1em}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;animation:rise .35s ease-out}
.fb h3{margin:0;font-size:18px}
.fb p{margin:0}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:5px solid var(--ok)}
.fb.ok h3{color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:5px solid var(--bad)}
.fb.bad h3{color:var(--bad)}
.fb.tip{background:var(--brass-soft);border-left:5px solid var(--brass)}
.fb.tip h3{color:var(--brass)}
.fb.lesson{background:var(--sea-soft);border-left:5px solid var(--sea)}
.fb.lesson h3{color:var(--sea)}
.xp{position:absolute;right:24px;top:20px;font-weight:700;color:var(--ok);font-size:20px;animation:float 1.1s ease-out forwards;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:var(--ok);opacity:.18;width:40px;height:40px;transform:translate(-50%,-50%) scale(0);animation:ripple .8s ease-out forwards;pointer-events:none}
.shake{animation:shake .4s}
.big{font-family:var(--display);font-size:44px;margin:0;line-height:1.1;color:var(--sea)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.foot{font-size:14px;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes float{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(30);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:6px}
.tile:hover{border-color:var(--sea)}
.tile.on{border:2px solid var(--sea);background:var(--sea-soft);color:var(--sea)}
.badge{background:var(--bad);color:var(--card);border-radius:999px;font-size:12px;padding:0 7px;line-height:18px}
.off{font-size:12px;background:var(--brass-soft);color:var(--brass);border-radius:999px;padding:1px 8px}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mini b{font-size:17px}
.mini.good{border-color:var(--ok);background:var(--ok-soft)}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{font:inherit;font-size:18px;cursor:pointer;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.tok:hover{border-color:var(--sea)}
.tok.sel{border-color:var(--sea);background:var(--sea-soft)}
.tok.right{border-color:var(--ok);background:var(--ok-soft)}
.tok.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tok[disabled]{cursor:default}
.inp.right{border-color:var(--ok);background:var(--ok-soft)}
.inp.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts.one{grid-template-columns:1fr}
.timer{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:var(--brass);transform-origin:left;animation:drain 20s linear forwards}
.xp.pts{color:var(--brass);top:48px}
.skills{display:flex;flex-direction:column;gap:12px}
.skill{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px}
.sk-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:999px;background:var(--bad-soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
.skill .btn{align-self:flex-start}
.arena{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.scen{font:inherit;text-align:left;cursor:pointer;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.scen:hover{border-color:var(--brass)}
.stars3{color:var(--brass);font-size:14px}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.tab.on{background:var(--sea);border-color:var(--sea);color:var(--card)}
.tblwrap{overflow-x:auto}
table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
.lb td{padding:9px 8px;border-bottom:1px solid var(--line)}
.lb .num{text-align:right}
.lb .rk{font-family:var(--display);color:var(--brass);width:40px}
.lb tr.me td{background:var(--sea-soft);font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;max-width:90vw}
.toast.show{animation:toast 3.2s ease forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.map{grid-template-columns:repeat(5,minmax(0,1fr))}.opts{grid-template-columns:1fr}h1{font-size:32px}.prompt{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lead{font-size:18px;margin:0;max-width:60ch}
.field{display:flex;flex-direction:column;gap:6px;max-width:360px}
.lbl{font-size:14px;color:var(--muted)}
.inp{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.inp:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.step h3{margin:0 0 2px;font-size:16px}.step p{margin:0;font-size:15px;color:var(--muted)}
.num{font-family:var(--display);font-size:22px;color:var(--brass);line-height:1}
.btn.small{font-size:14px;padding:6px 12px}
.tools{justify-content:flex-start}
.link{font:inherit;background:none;border:0;padding:0;color:var(--sea);text-decoration:underline;cursor:pointer}
.stars{display:flex;gap:4px}
.star{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.star.on{color:var(--brass)}
textarea.inp{resize:vertical;font-size:16px}
#fbpanel h3{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Proseidon</h1>
      <p class="tag" id="tag">Climb ten levels of English, from parts of speech to PhD.</p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="sLevel">–</b><span>Level</span></div>
      <div class="stat hot"><b id="sDay">0</b><span>Day streak</span></div>
      <div class="stat hot"><b id="sPts">–</b><span>Week pts</span></div>
      <div class="stat"><b id="sXp">0</b><span>XP</span></div>
      <div class="stat"><b id="sAcc">–</b><span>Accuracy</span></div>
    </div>
  </header>
  <nav class="tiles" id="tiles" aria-label="Sections">
    <button class="tile" data-view="home">Home</button>
    <button class="tile" data-view="review" id="tReview">Review</button>
    <button class="tile" data-view="weak">Weak spots</button>
    <button class="tile" data-view="arena">Arena</button>
    <button class="tile" data-view="lb">Leaderboard</button>
  </nav>
  <nav class="map" id="map" aria-label="Levels"></nav>
  <main class="card" id="card" aria-live="polite"></main>
  <p class="foot">Each level draws 5 questions from its bank, with no repeats until you've seen them all. Get 4 right to clear a level. Keys 1 to 4 pick an answer, Enter checks it.</p>
  <div class="row tools" id="tools"><button class="btn ghost small" id="rateT">Rate and give feedback</button><button class="btn ghost small" id="retake">Retake the assessment</button><button class="btn ghost small" id="reset">Reset my progress</button><span id="confirm"></span></div>
  <section class="card" id="fbpanel" hidden></section>
</div>
<div class="toast" id="toast" role="status"></div>
<form name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="feedback"><input name="bot-field"><input name="rating"><input name="username"><input name="level"><textarea name="comments"></textarea>
</form>
<script type="module" src="app.js"></script>
</body>
</html>
